
[Input]
    slab_filename                       = "./slab/OUTCAR"       # path of file containing the slab atomic coordinates. The list of supported file types can be found on ASE website
    molecule_filename                   = "./mol/OUTCAR"        # path of file containing the molecule atomic coordinates. The list of supported file types can be found on ASE website
    #E_slab_mol                         = [0.0, 0.0]            # slab and isolated molecule energies ***in eV !***
    jobscript_path                      = "jobscript.sh"        # path of a jobscript for running the DFT code
    #jobscript_ml_path                  = "jobscript_ml.sh"     # path of a jobscript for running the machine learning model
    scheduler                           = "slurm"               # scheduler name (supported: slur, pbs, lsf, condor/htcondor, sge, toreue. If you use a different scheduler, please add it to the list in xsorb/io/scheduler.py)
    #jobname_prefix                     = "ads"                 # prefix for the job names (max 3 letters, exceeding letters will be discarded). works only for Slurm

[Structure]

    [Structure.adsorption_sites]
        mode                            = "high_symmetry"       # 'high_symmetry' or 'coord_number'
        surface_thickness               = 0.9                   # thickness (delta_z) of the surface layer (in Angstrom) to be considered as surface atoms
        #selected_sites                 = [0, 1, 2]             # explicitly select the adsorption sites by index between those of the figure generated by running xsorb -sites

        [Structure.adsorption_sites.high_symmetry_params]
            symm_reduce                 = 0.01                  # tolerance for finding symmetrically inequivalent sites

        #[Structure.adsorption_sites.coord_number_params]
            #cn_method                  = "plain"               # method for finding coordination numbers: 'plain' (default, produces integer values), 'MinimumDistanceNN' (Pymatgen, integer values), 'CrystalNN' (Pymatgen, more advanceed, real values)
            #cn_plain_fixed_radius      = 1.5                   # fixed radius for the plain coordination number method (half of the max distance between two atoms to be considered nearest neighbors)
            #range_selection            = {mode = "max", value = 4}  # if mode is 'max', select all sites with CN <= value, if mode is 'offset', select all sites with CN = min(CN) + value
            #include_surrounding_sites  = false                 # include also surrounding sites as new sites (only for vertical rotation)
            #surrounding_sites_deltaz   = 1.5                   # ontop sites for the neighbor atoms with z >= z_central_atom - surrounding_sites_deltaz will be included as surrounding sites
            #atomic_species             = ["Cu", "Ni"]          # explicitly select only certain atomic species for the site selection

    [Structure.molecule]
        molecule_axis                   = {mode = "atoms", values = [3, 14]}  # indices of the two atoms to define the x-axis direction, or vector to take as x-axis, e.g. {mode = "vector", values = [1,0,0]}
        selected_atom_indexes           = [0]                   # list of selected atom in molecule file, to be placed in all adsorption sites. If -1, use the geometric center of the molecule.

        x_rot_angles                    = [0, 90, 180]          # rotation angles (in deg) about x axis (performed first)
        y_rot_angles                    = [0, 90]               # rotation about y axis (performed secondly)
        z_rot_angles                    = [0, 90]               # rotation about z axis (performed lastly). Can be list or "surrounding" (rotate around the z axis towards the surrounding sites, if they are defined in the adsorption_sites section).
        vertical_angles                 = "x"                   # which angles for y_rot +/- 90. Options: "x" (use x_rot_angles), "z" (use z_rot_angles), "none" (no rotations), list [list of angles] (custom list)
        #individual_rotations           = [[12, 50, 86], [1, 7, 8]]  # list of individual rotations, not to be included in the combinations. Each one should be a list of [x,y,z] angles (in deg)

        adsorption_distance_mode        = "value"               # options: 'value', 'covalent_radius', 'vdw_radius'
        target_distance                 = 2.0                   # if adsorption_distance_mode is "value", DESIRED distance (in A) of the selected atom from the surface (z coord. above the topmost layer)
        min_distance                    = 1.5                   # if adsorption_distance_mode is "value", minimum distance (in A) of ANY mol atom from ANY slab atom, must be < target_distance. The molecule is translated upwards if necessary, in order to meet this requirement.
        #radius_scale_factor            = 1.1                   # scaling factor for the covalent radii to determine bonding
        radius_scale_factor_gen         = 0.9                   # scaling factor for the covalent/van der Waals radii to determine the initial distance when generating the structures when adsoption_distance_mode is "covalent_radius" or "vdw_radius"

    #[Structure.constraints]
        #layers_height                  = 0.5                   # delta_z within which atoms are considered to be part of the same layer (for fixing atoms). This is different from the surface_height flag, used for surface adsorption sites.
        #fixed_layers_slab              = [0, 1, 2]             # fix chosen layers of the slab for relaxation (indices start from 0, corresponding to the bottom layer).
        #fixed_indices_slab             = [0, 1, 2, 3, 4, 5]    # fix chosen atoms of the slab for relaxation. Indices are to be taken as in slab file. -1 = fix all
        #fixed_thickness_slab           = 3.0                   # fix all atoms below a certain height (z coordinate) from the bottom of the cell (in Angstrom)
        #fixed_indices_mol              = [3]                   # fix chosen atoms of the molecule for relaxation. Indices are to be taken as in slab file, possibly more than one site. -1 = fix all
        #fix_slab_xyz                   = [true,true,true]      # coordinates (x,y,z) to fix for the selected atoms in slab: true=fix, false=relax
        #fix_mol_xyz                    = [true,true,false]     # coordinates (x,y,z) to fix for the selected atoms in molecule: true=fix, false=relax
        #fix_slab_ml_opt                = false                 # fix all slab atoms in the optimization with the machine learning potential

    #[Structure.misc]
        #inside_only                    = false                 # only include adsorption configurations with coordinates inside the cell (neglecting pbcs), with a tolerance of 1% in fractional coordinates
        #mol_before_slab                = false                 # put molecule before slab in the order of atoms (only for xyz and pwi, not VASP)
        #sort_atoms_by_z                = true                  # sort atoms by z coordinate in the input files from lowest to highest(only for xyz and pwi, not VASP)
        #translate_slab                 = true                  # translate the slab upwards so that the lowest atom is exactly 1 Angstrom above the cell bottom


[Calculation_parameters]
    program                             = "vasp"                # vasp, espresso, ml (write ml only if you do not want to run DFT at all


    [Calculation_parameters.vasp]
        vasp_pp_path                    = "path/to/pseudo"      # The pseudopotentials are expected to be in: LDA: VASP_PP_PATH/potpaw/, PBE: VASP_PP_PATH/potpaw_PBE/, PW91: $VASP_PP_PATH/potpaw_GGA/ (see https://wiki.fysik.dtu.dk/ase/ase/calculators/vasp.html)
        #vasp_xc_functional             = "PBE"                 # default: PBE
        #vasp_pseudo_setups             = {"base": "recommended", "6": "C_h", "C": "_s"}  # for the default versions (without subscripts) just remove/comment this line. Options for base are "minimal", "recommended", "materialsproject", "gw" (see ase.calculators.vasp.setups)
        #pymatgen_set                   = "MPRelaxSet"          # Use INCAR/KPOINTS preset from Pymatgen's sets, as defined in pymatgen.io.vasp.sets (options: MPRelaxSet, MPMetalRelaxSet, MPScanRelaxSet, MPHSERelaxSet, MITRelaxSet)
        incar_path                      = "INCAR"               # path of the INCAR file
        kpoints_path                    = "KPOINTS"             # path of the KPOINTS file
        incar_path_screening            = "INCAR_screening"     # path of the INCAR file for screening calculations (e.g. with lowered cutoff/PREC)
        kpoints_path_screening          = "KPOINTS_screening"   # path of the KPOINTS file for screening calculations (e.g. less dense k-point mesh)
        ediffg_screening                = -0.5                  # convergence threshold for forces (eV/A, VASP units)

    #[Calculation_parameters.espresso]
        #pwi_path                       = "template.pwi"        # path of the input file for Quantum Espresso (containing the settings, without the positions)
        #pwi_path_screening             = "template_screening.pwi"  # path of the input file for Quantum Espresso for screening calculations (e.g. with lowered cutoff/k-point mesh)
        #etot_conv_thr_screening        = 5e-3                  # convergence threshold for energy (Ry, QE units)
        #forc_conv_thr_screening        = 5e-2                  # convergence threshold for forces (Ry/bohr, QE units)

[Database]
    store_full_trajectories            = false                  # store the full trajectories in the database